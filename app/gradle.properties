# Gradle JVM cap: keep the build inside the host memory budget.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Short daemon idle timeout; gate runs use --no-daemon anyway.
org.gradle.daemon.idletimeout=60000
# Keep Kotlin compilation inside the Gradle JVM so the memory cap is meaningful.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
